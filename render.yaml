# Render Blueprint. Secrets stay in the dashboard (sync: false).
# Production must use Postgres — do not set SPRING_PROFILES_ACTIVE=nodb.

services:
  - type: web
    name: blink-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BLINK_AGENT_RUNTIME_URL
        value: https://z5i3yybrx1.execute-api.us-west-2.amazonaws.com
      - key: BLINK_AGENT_RUNTIME_LAMBDA_FUNCTION
        value: blink-agent-runtime
      - key: BLINK_AGENT_RUNTIME_TOKEN
        sync: false
      - key: BLINK_AUTOMATION_SDLC_GIT_URL
        value: https://github.com/AtulTalentServ/automation_sdlc.git
      - key: BLINK_CORS_ORIGINS
        sync: false
      - key: BLINK_INTEGRATION_SECRET_KEY
        sync: false
      - key: BLINK_JIRA_CLIENT_ID
        sync: false
      - key: BLINK_JIRA_CLIENT_SECRET
        sync: false
      - key: BLINK_GITHUB_CLIENT_ID
        sync: false
      - key: BLINK_GITHUB_CLIENT_SECRET
        sync: false
      - key: BLINK_FIGMA_CLIENT_ID
        sync: false
      - key: BLINK_FIGMA_CLIENT_SECRET
        sync: false
      - key: BLINK_FIGMA_SCOPES
        value: current_user:read,file_content:read,file_metadata:read,webhooks:write,mcp:connect
      - key: STITCH_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: S3_BUCKET_NAME
        value: blink-ai-dev
      - key: BLINK_PROD
        value: "true"
      - key: BLINK_SMTP_HOST
        sync: false
      - key: BLINK_SMTP_USERNAME
        sync: false
      - key: BLINK_SMTP_PASSWORD
        sync: false
      - key: BLINK_SMTP_FROM
        sync: false
      - key: BLINK_SMTP_ENABLED
        value: "false"
      - key: BLINK_GMAIL_CLIENT_ID
        sync: false
      - key: BLINK_GMAIL_CLIENT_SECRET
        sync: false
      - key: BLINK_GMAIL_REFRESH_TOKEN
        sync: false
      - key: BLINK_GMAIL_FROM
        sync: false
      - key: BLINK_LOGIN_ALLOWED_DOMAIN
        value: talentserv.co.in
      - key: BLINK_LOGIN_GATE
        sync: false
      - key: BLINK_JIRA_REDIRECT_URI
        sync: false
      - key: BLINK_GITHUB_REDIRECT_URI
        sync: false
      - key: BLINK_FIGMA_REDIRECT_URI
        sync: false
