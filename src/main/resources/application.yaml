server:
  port: ${PORT:8090}
  forward-headers-strategy: framework

spring:
  application:
    name: blink-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blink}
    username: ${SPRING_DATASOURCE_USERNAME:blink}
    password: ${SPRING_DATASOURCE_PASSWORD:blink}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

blink:
  automation-sdlc-path: ${BLINK_AUTOMATION_SDLC_PATH:../automation_sdlc}
  demo-user-email: blink.system@talentserv.com
  cors-origins: ${BLINK_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  setup-agent-url: ${BLINK_SETUP_AGENT_URL:http://127.0.0.1:8091/setup/start}
  agent-runtime-url: ${BLINK_AGENT_RUNTIME_URL:https://z5i3yybrx1.execute-api.us-west-2.amazonaws.com}
  agent-runtime-token: ${BLINK_AGENT_RUNTIME_TOKEN:blink-groom-2026}
  agent-runtime-lambda-function: ${BLINK_AGENT_RUNTIME_LAMBDA_FUNCTION:blink-agent-runtime}
  aws-access-key-id: ${AWS_ACCESS_KEY_ID:}
  aws-secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  aws-region: ${AWS_REGION:us-west-2}
  s3-bucket-name: ${S3_BUCKET_NAME:}
  s3-public-base-url: ${S3_PUBLIC_BASE_URL:}
  automation-sdlc-git-url: ${BLINK_AUTOMATION_SDLC_GIT_URL:https://github.com/AtulTalentServ/automation_sdlc.git}
  canonical-setup-python: ${BLINK_CANONICAL_SETUP_PYTHON:python3}
  canonical-setup-timeout: ${BLINK_CANONICAL_SETUP_TIMEOUT:90s}
  jira-client-id: ${BLINK_JIRA_CLIENT_ID:}
  jira-client-secret: ${BLINK_JIRA_CLIENT_SECRET:}
  jira-redirect-uri: ${BLINK_JIRA_REDIRECT_URI:}
  jira-scopes: ${BLINK_JIRA_SCOPES:read:jira-work write:jira-work delete:jira-work read:jira-user read:me offline_access}
  github-client-id: ${BLINK_GITHUB_CLIENT_ID:}
  github-client-secret: ${BLINK_GITHUB_CLIENT_SECRET:}
  github-redirect-uri: ${BLINK_GITHUB_REDIRECT_URI:}
  github-scopes: "${BLINK_GITHUB_SCOPES:repo read:org user:email}"
  figma-client-id: ${BLINK_FIGMA_CLIENT_ID:}
  figma-client-secret: ${BLINK_FIGMA_CLIENT_SECRET:}
  figma-redirect-uri: ${BLINK_FIGMA_REDIRECT_URI:}
  figma-scopes: "${BLINK_FIGMA_SCOPES:current_user:read,file_content:read,file_metadata:read}"
  figma-webhook-public-base: ${BLINK_FIGMA_WEBHOOK_PUBLIC_BASE:}
  stitch-api-key: ${STITCH_API_KEY:}
  integration-secret-key: ${BLINK_INTEGRATION_SECRET_KEY:}
  smtp-host: ${BLINK_SMTP_HOST:}
  smtp-port: ${BLINK_SMTP_PORT:587}
  smtp-username: ${BLINK_SMTP_USERNAME:}
  smtp-password: ${BLINK_SMTP_PASSWORD:}
  smtp-from: ${BLINK_SMTP_FROM:blink@localhost}
  smtp-start-tls: ${BLINK_SMTP_START_TLS:true}
  smtp-outbox-dir: ${BLINK_SMTP_OUTBOX_DIR:.blink-outbox}
  gmail-client-id: ${BLINK_GMAIL_CLIENT_ID:}
  gmail-client-secret: ${BLINK_GMAIL_CLIENT_SECRET:}
  gmail-refresh-token: ${BLINK_GMAIL_REFRESH_TOKEN:}
  gmail-from: ${BLINK_GMAIL_FROM:}
  gmail-redirect-uri: ${BLINK_GMAIL_REDIRECT_URI:}
  login-allowed-domain: ${BLINK_LOGIN_ALLOWED_DOMAIN:talentserv.co.in}
  otp-ttl: ${BLINK_OTP_TTL:5m}
  otp-resend-cooldown: ${BLINK_OTP_RESEND_COOLDOWN:45s}
  session-ttl: ${BLINK_SESSION_TTL:12h}
  otp-max-attempts: ${BLINK_OTP_MAX_ATTEMPTS:5}
  otp-reveal: ${BLINK_OTP_REVEAL:${BLINK_OTP_REVEAL_LOCALLY:false}}
  login-gate: ${BLINK_LOGIN_GATE:}

